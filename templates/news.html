<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    width: 1200px;
    margin: 0 auto;
    background: #1e2230;
    color: #fff;
    font-size: {{ base_size }}px;
  }
  .overlay {
    background: rgba(255, 255, 255, 0.03);
    padding: 36px 40px 40px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .header h1 { font-size: 2em; letter-spacing: 2px; }
  .header .count {
    background: rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 12px 26px;
    font-size: 1.8em;
    font-weight: bold;
  }
  .meta {
    color: #cfcfcf;
    font-size: 0.8em;
    margin-bottom: 26px;
  }

  /* ===== 分类：无背景，只有标题颜色区分 ===== */
  .cat {
    background: transparent;
    border-radius: 0;
    padding: 12px 0 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .cat-title {
    font-size: 1.3em;
    font-weight: bold;
    border-left: 4px solid #888;
    padding-left: 12px;
    margin-bottom: 12px;
  }

  /* 重要：红色 */
  .cat-important .cat-title { border-left-color: #ff5252; color: #ff5252; }
  /* 科研竞赛：青色 */
  .cat-research  .cat-title { border-left-color: #26c6da; color: #26c6da; }
  /* 研究生：紫色 */
  .cat-graduate  .cat-title { border-left-color: #9c6bff; color: #9c6bff; }
  /* 其他：灰蓝 */
  .cat-other     .cat-title { border-left-color: #8a9cb8; color: #8a9cb8; }

  /* ===== 条目：只靠左边竖线区分新鲜度 ===== */
  .item {
    display: block;
    padding: 10px 0 10px 14px;
    border-radius: 0;
    margin-bottom: 0;
    background: transparent;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    border-left: 3px solid transparent;
  }
  .item:last-child { border-bottom: none; }

  /* 最近 3 天：绿 */
  .item.new    { border-left-color: #3ddb7c; }
  /* 最近 1 个月：蓝 */
  .item.recent { border-left-color: #4db8ff; }
  /* 更早：灰 */
  .item.old    { border-left-color: rgba(255, 255, 255, 0.2); }
  /* 无日期：淡灰 */
  .item.none   { border-left-color: rgba(255, 255, 255, 0.1); opacity: 0.7; }

  /* 日期颜色加深 */
  .item.new    .day { color: #3ddb7c; font-weight: bold; }
  .item.recent .day { color: #4db8ff; }
  .item.old    .day { color: #bbb; }
  .item.none   .day { color: #999; }

  .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 1em;
  }
  .idx {
    color: #888;
    font-weight: bold;
    margin-right: 12px;
  }
  .title {
    max-width: 900px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day { font-size: 0.85em; flex-shrink: 0; margin-left: 14px; }
  .row2 {
    margin-top: 6px;
    font-size: 0.95em;
    color: #999;
    padding-left: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row2 .site {
    background: rgba(255, 255, 255, 0.06);
    color: #aab;
    padding: 2px 10px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .row2 .url {
    color: #888;
    font-size: 1em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 800px;
  }
  .empty { color: #888; font-size: 0.9em; padding-left: 16px; margin-top: 8px; }

  /* 底部小字 */
  .footer-note {
    margin-top: 24px;
    text-align: center;
    font-size: 0.75em;
    color: #888;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="overlay">
  <div class="header">
    <h1>📢 烟大新闻</h1>
    <div class="count">{{ total }}</div>
  </div>
  <div class="meta">{{ title }} · {{ now }}</div>

  {% for cat, items in groups.items() %}
  {% if items %}
  <div class="cat cat-{{ {'重要':'important','科研竞赛':'research','研究生':'graduate','其他':'other'}.get(cat, 'other') }}">
    <div class="cat-title">{{ cat }}</div>
    {% for it in items %}
    <div class="item {{ it.freshness }}">
      <div class="row1">
        <span class="title"><span class="idx">{{ it.idx_str }}</span>{{ it.title }}</span>
        <span class="day">{{ it.date }}</span>
      </div>
      <div class="row2">
        <span class="site">{{ it.site }}</span>
        <span class="url">{{ it.url }}</span>
      </div>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endfor %}

  <div class="footer-note">
    {{ footer_note }} · 抖音号：{{ douyin_id }}
  </div>
</div>
</body>
</html>
