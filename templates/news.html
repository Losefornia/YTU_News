<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    width: 1200px;
    margin: 0 auto;
    background: #1e2230;
    color: #fff;
    font-size: {{ base_size }}px;
  }
  .overlay {
    background: rgba(255, 255, 255, 0.03);
    padding: 36px 40px 40px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .header h1 { font-size: 2em; letter-spacing: 2px; }
  .header .count {
    background: rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 12px 26px;
    font-size: 1.8em;
    font-weight: bold;
  }
  .meta {
    color: #cfcfcf;
    font-size: 0.8em;
    margin-bottom: 26px;
  }

  .cat {
    padding: 12px 0 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .cat:last-child { border-bottom: none; }
  .cat-title {
    font-size: 1.3em;
    font-weight: bold;
    border-left: 4px solid #888;
    padding-left: 12px;
    margin-bottom: 12px;
  }
  .cat-important .cat-title { border-left-color: #ff5252; color: #ff5252; }
  .cat-research  .cat-title { border-left-color: #26c6da; color: #26c6da; }
  .cat-graduate  .cat-title { border-left-color: #9c6bff; color: #9c6bff; }
  .cat-other     .cat-title { border-left-color: #8a9cb8; color: #8a9cb8; }

  .item {
    display: block;
    padding: 10px 0 10px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    border-left: 3px solid transparent;
  }
  .item:last-child { border-bottom: none; }

  .item.new    { border-left-color: #3ddb7c; }
  .item.recent { border-left-color: #4db8ff; }
  .item.old    { border-left-color: rgba(255, 255, 255, 0.2); }
  .item.none   { border-left-color: rgba(255, 255, 255, 0.1); opacity: 0.7; }

  .item.new    .day { color: #3ddb7c; font-weight: bold; }
  .item.recent .day { color: #4db8ff; }
  .item.old    .day { color: #c8c8c8; }
  .item.none   .day { color: #999; }

  .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 1em;
    gap: 14px;
  }
  .idx {
    color: #888;
    font-weight: bold;
    margin-right: 12px;
  }
  .title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-height: 1.35;
  }
  .day {
    font-size: 0.85em;
    flex-shrink: 0;
    white-space: nowrap;
    min-width: 90px;
    text-align: right;
  }
  .row2 {
    margin-top: 6px;
    font-size: 0.9em;
    color: #9aa;
    padding-left: 34px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .row2 .site {
    background: rgba(255, 255, 255, 0.06);
    color: #bcc;
    padding: 2px 10px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .footer-note {
    margin-top: 24px;
    text-align: center;
    font-size: 0.75em;
    color: #888;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="overlay">
  <div class="header">
    <h1>📢 烟大新闻</h1>
    <div class="count">{{ total }}</div>
  </div>
  <div class="meta">{{ title }} · {{ now }}</div>

  {% for cat, items in groups %}
  {% if items %}
  <div class="cat cat-{{ cat_classes.get(cat, 'other') }}">
    <div class="cat-title">{{ cat }}（{{ items|length }}）</div>
    {% for it in items %}
    <div class="item {{ it.freshness }}">
      <div class="row1">
        <span class="title"><span class="idx">{{ it.idx_str }}</span>{{ it.title }}</span>
        <span class="day">{{ it.date_str or "未知" }}</span>
      </div>
      <div class="row2">
        <span class="site">{{ it.site }}</span>
      </div>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endfor %}

  <div class="footer-note">
    {{ footer_note }} · 抖音号：{{ douyin_id }}
  </div>
</div>
</body>
</html>
