<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    width: 1200px;
    margin: 0 auto;
    background: #1a1d24;
    color: #fff;
    font-size: {{ base_size }}px;
  }
  .overlay {
    background: rgba(0, 0, 0, 0.35);
    padding: 36px 40px 40px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .header h1 { font-size: 2em; letter-spacing: 2px; }
  .header .count {
    background: rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 12px 26px;
    font-size: 1.8em;
    font-weight: bold;
  }
  .meta {
    color: #cfcfcf;
    font-size: 0.8em;
    margin-bottom: 26px;
  }
  .cat {
    background: rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 18px;
  }
  .cat-title {
    font-size: 1.3em;
    font-weight: bold;
    border-left: 4px solid #6cf;
    padding-left: 12px;
    margin-bottom: 16px;
  }
  .item {
    display: block;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 6px;
  }

  /* 最近 3 天：亮蓝 */
  .item.new {
    background: rgba(108, 204, 255, 0.22);
    border-left: 4px solid #6cf;
  }
  /* 最近 1 个月：暖黄 */
  .item.recent {
    background: rgba(255, 214, 102, 0.12);
    border-left: 4px solid #ffd666;
  }
  /* 更早：冷灰 */
  .item.old {
    background: rgba(255, 255, 255, 0.03);
    border-left: 4px solid rgba(255,255,255,0.15);
  }
  /* 无日期：最淡 */
  .item.none {
    background: rgba(255, 255, 255, 0.02);
    border-left: 4px solid rgba(255,255,255,0.08);
    opacity: 0.7;
  }

  /* 日期文字随档位变色 */
  .item.new   .day { color: #6cf;     font-weight: bold; }
  .item.recent .day { color: #ffd666; }
  .item.old   .day { color: #aaa; }
  .item.none  .day { color: #888; }

  .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 1em;
  }
  .idx {
    color: #6cf;
    font-weight: bold;
    font-size: 1em;
    margin-right: 12px;
  }
  .title {
    max-width: 900px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day { color: #aaa; font-size: 0.85em; flex-shrink: 0; margin-left: 14px; }
  .row2 {
    margin-top: 6px;
    font-size: 0.95em;
    color: #999;
    padding-left: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row2 .site {
    background: rgba(108, 204, 255, 0.10);
    color: #8cd4ff;
    padding: 2px 10px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .row2 .url {
    color: #888;
    font-size: 1em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 800px;
  }
  .empty { color: #888; font-size: 0.9em; padding-left: 16px; margin-top: 8px; }

  /* 底部小字 */
  .footer-note {
    margin-top: 24px;
    text-align: center;
    font-size: 0.75em;
    color: #888;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="overlay">
  <div class="header">
    <h1>📢 烟大新闻</h1>
    <div class="count">{{ total }}</div>
  </div>
  <div class="meta">{{ title }} · {{ now }}</div>

  {% for cat, items in groups.items() %}
  {% if items %}
  <div class="cat">
    <div class="cat-title">{{ cat }}</div>
    {% for it in items %}
    <div class="item {{ it.freshness }}">
      <div class="row1">
        <span class="title"><span class="idx">{{ it.idx_str }}</span>{{ it.title }}</span>
        <span class="day">{{ it.date }}</span>
      </div>
      <div class="row2">
        <span class="site">{{ it.site }}</span>
        <span class="url">{{ it.url }}</span>
      </div>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endfor %}

  <div class="footer-note">
    {{ footer_note }} · 抖音号：{{ douyin_id }}
  </div>
</div>
</body>
</html>
