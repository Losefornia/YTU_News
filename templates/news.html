<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    width: 1200px;
    margin: 0 auto;
    background: #1e2230;
    color: #fff;
    font-size: {{ base_size }}px;
  }
  .overlay {
    background: rgba(255, 255, 255, 0.03);
    padding: 36px 40px 40px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .header h1 { font-size: 2em; letter-spacing: 2px; }
  .header .count {
    background: rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 12px 26px;
    font-size: 1.8em;
    font-weight: bold;
  }
  .meta {
    color: #cfcfcf;
    font-size: 0.8em;
    margin-bottom: 26px;
  }

  .cat {
    background: transparent;
    border-radius: 0;
    padding: 12px 0 8px;
    margin-bottom: 14px;
  }
  .cat-title {
    font-size: 1.3em;
    font-weight: bold;
    border-left: 4px solid #888;
    padding-left: 12px;
    margin-bottom: 12px;
  }

  .cat-important .cat-title { border-left-color: #ff5252; color: #ff5252; }
  .cat-research  .cat-title { border-left-color: #26c6da; color: #26c6da; }
  .cat-graduate  .cat-title { border-left-color: #9c6bff; color: #9c6bff; }
  .cat-other     .cat-title { border-left-color: #8a9cb8; color: #8a9cb8; }

  /* ===== 每条新闻：圆角卡片 + 按新鲜度给背景色 ===== */
  .item {
    display: block;
    padding: 10px 14px;
    margin-bottom: 4px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    border-left: 3px solid transparent;
  }

  /* 新鲜度背景色（半透明，深色底上不刺眼） */
  .item.new {
    background: rgba(61, 219, 124, 0.12);
    border-left-color: #3ddb7c;
  }
  .item.recent {
    background: rgba(77, 184, 255, 0.10);
    border-left-color: #4db8ff;
  }
  .item.old {
    background: rgba(255, 255, 255, 0.04);
    border-left-color: rgba(255, 255, 255, 0.2);
  }
  .item.none {
    background: rgba(255, 255, 255, 0.03);
    border-left-color: rgba(255, 255, 255, 0.1);
    opacity: 0.7;
  }

  /* 日期颜色跟着新鲜度 */
  .item.new    .day { color: #3ddb7c; font-weight: bold; }
  .item.recent .day { color: #4db8ff; }
  .item.old    .day { color: #bbb; }
  .item.none   .day { color: #999; }

  .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 1em;
  }
  .idx {
    color: #888;
    font-weight: bold;
    margin-right: 12px;
  }
  .title {
    max-width: 900px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day {
    font-size: 0.85em;
    flex-shrink: 0;
    margin-left: 14px;
    min-width: 90px;
    text-align: right;
  }
  .row2 {
    margin-top: 6px;
    font-size: 0.95em;
    color: #b0b8c8;
    padding-left: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row2 .site {
    background: rgba(255, 255, 255, 0.1);
    color: #c0c8d8;
    padding: 2px 10px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .row2 .url {
    color: #98a0b0;
    font-size: 1em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 800px;
  }
  .empty { color: #888; font-size: 0.9em; padding-left: 16px; margin-top: 8px; }

  .footer-note {
    margin-top: 24px;
    text-align: center;
    font-size: 0.75em;
    color: #888;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="overlay">
  <div class="header">
    <h1>📢 烟大新闻</h1>
    <div class="count">{{ total }}</div>
  </div>
  <div class="meta">{{ title }} · {{ now }}</div>

  {% for cat, items in groups.items() %}
  {% if items %}
  <div class="cat cat-{{ {'重要':'important','科研竞赛':'research','研究生':'graduate','其他':'other'}.get(cat, 'other') }}">
    <div class="cat-title">{{ cat }}</div>
    {% for it in items %}
    <div class="item {{ it.freshness }}">
      <div class="row1">
        <span class="title"><span class="idx">{{ it.idx_str }}</span>{{ it.title }}</span>
        <span class="day">{{ it.date }}</span>
      </div>
      <div class="row2">
        <span class="site">{{ it.site }}</span>
        <span class="url">{{ it.url }}</span>
      </div>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endfor %}

  <div class="footer-note">
    {{ footer_note }} · 抖音号：{{ douyin_id }}
  </div>
</div>
</body>
</html>
